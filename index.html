<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rastreador Polymarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #0a0e14;
    --panel: #11161f;
    --panel-2: #161c27;
    --panel-3: #1b2230;
    --border: #232b38;
    --text: #e8edf5;
    --text-dim: #7c8797;
    --text-faint: #4d5666;
    --buy: #37d67a;
    --buy-dim: #1a3327;
    --sell: #ff5c72;
    --sell-dim: #341c22;
    --accent: #ffb238;
    --accent-dim: #3a2c10;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100%;
    line-height: 1.5;
  }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 24px 18px 60px;
  }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  header.top h1 {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--text);
  }
  header.top h1 span { color: var(--text-faint); font-weight: 500; }
  .status-strip {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
  }
  .live-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--buy);
    box-shadow: 0 0 0 0 rgba(55,214,122,0.5);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(55,214,122,0.45); }
    70% { box-shadow: 0 0 0 6px rgba(55,214,122,0); }
    100% { box-shadow: 0 0 0 0 rgba(55,214,122,0); }
  }

  /* manage panel */
  .manage {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 18px;
  }
  .manage-title {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }
  .add-grid {
    display: grid;
    grid-template-columns: 1fr 1.4fr auto;
    gap: 8px;
    margin-bottom: 12px;
  }
  .add-grid input {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    outline: none;
    min-width: 0;
    width: 100%;
  }
  .add-grid input::placeholder { color: var(--text-faint); }
  .add-grid input:focus { border-color: var(--accent); }
  .add-grid button {
    background: var(--accent);
    color: #1a1305;
    border: none;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13px;
    padding: 0 18px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .add-grid button:active { transform: translateY(1px); }

  .wallet-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 6px 5px 12px;
    font-size: 12.5px;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .chip .chip-name { font-weight: 600; }
  .chip .chip-addr { font-family: var(--mono); color: var(--text-faint); font-size: 10.5px; }
  .chip button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    width: 20px; height: 20px;
    border-radius: 50%;
    font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }
  .chip button:hover { background: var(--panel-3); color: var(--text); }

  .hint {
    font-size: 11.5px;
    color: var(--text-faint);
  }

  /* feed */
  .feed-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 22px 0 10px;
  }
  .feed-head h2 {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0;
    font-weight: 600;
  }

  .feed {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .row {
    display: grid;
    grid-template-columns: 3px 50px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 11px 14px 11px 0;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row-bar { align-self: stretch; border-radius: 2px; }

  .side-tag {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 3px 0;
    border-radius: 5px;
    text-align: center;
  }
  .side-tag.buy { background: var(--buy-dim); color: var(--buy); }
  .side-tag.sell { background: var(--sell-dim); color: var(--sell); }
  .side-tag.other { background: var(--border); color: var(--text-dim); }

  .row-mid { min-width: 0; }
  .row-who {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 2px;
  }
  .row-who .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .row-who-name {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .row-title {
    font-size: 13.5px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 2px;
  }
  .row-sub .outcome-yes { color: var(--buy); }
  .row-sub .outcome-no { color: var(--sell); }

  .row-num {
    text-align: right;
    font-family: var(--mono);
    white-space: nowrap;
  }
  .row-amt { font-size: 13.5px; font-weight: 600; color: var(--text); }
  .row-odd { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .empty, .loading, .error {
    padding: 26px 16px;
    text-align: center;
    color: var(--text-faint);
    font-size: 13px;
  }
  .error { color: var(--sell); }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 13px;
    border: 1px dashed var(--border);
    border-radius: 12px;
  }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 560px) {
    .add-grid { grid-template-columns: 1fr; }
    .row { grid-template-columns: 3px 0 1fr auto; padding-left: 0; }
    .row-mid { grid-column: 3; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>polymarket<span>/</span>rastreador</h1>
    <div class="status-strip"><span class="live-dot"></span><span id="clock"></span></div>
  </header>

  <div class="manage">
    <div class="manage-title">Carteiras acompanhadas</div>
    <div class="add-grid">
      <input id="nick-input" type="text" placeholder="Apelido (ex: Fulano)" autocomplete="off">
      <input id="addr-input" type="text" placeholder="Endereço da carteira (0x...)" autocomplete="off" spellcheck="false">
      <button id="add-btn">Adicionar</button>
    </div>
    <div class="wallet-chips" id="wallet-chips"></div>
    <div class="hint" style="margin-top:10px;">Encontre o endereço na URL do perfil: polymarket.com/profile/<b style="color:var(--text-dim)">0x...</b> · clique no lápis de um apelido pra renomear</div>
  </div>

  <div class="feed-head">
    <h2>Histórico geral</h2>
    <div class="hint" id="feed-count"></div>
  </div>
  <div class="feed" id="feed"></div>
  <div id="empty-placeholder" class="empty-state">Nenhuma carteira adicionada ainda.<br>Adicione uma acima pra começar a ver o histórico.</div>
</div>

<script>
const STORAGE_KEY = 'pm_tracker_wallets_v2';
const API = '/api/activity';
const COLORS = ['#ffb238','#37d67a','#5b9dff','#ff5c72','#c792ea','#4dd0e1','#ffa1c9','#a3e635','#ff8c42','#7ec8e3'];
const POLL_MS = 5000;

let wallets = [];        // [{address, nickname, color}]
let activityCache = {};  // address -> array of raw items from API

function migrateOldFormat() {
  try {
    const old = localStorage.getItem('pm_tracker_wallets_v1');
    if (old && !localStorage.getItem(STORAGE_KEY)) {
      const arr = JSON.parse(old);
      if (Array.isArray(arr)) {
        wallets = arr.map((addr, i) => ({ address: addr, nickname: '', color: COLORS[i % COLORS.length] }));
        saveWallets();
      }
    }
  } catch (e) { /* ignore */ }
}

function loadWallets() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    wallets = raw ? JSON.parse(raw) : [];
  } catch (e) { wallets = []; }
  if (wallets.length === 0) migrateOldFormat();
}
function saveWallets() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(wallets)); }
  catch (e) { /* ignore */ }
}

function shortAddr(a) {
  if (!a) return '';
  return a.slice(0, 6) + '…' + a.slice(-4);
}

function timeAgo(unixSeconds) {
  const diff = Math.max(0, Date.now()/1000 - unixSeconds);
  if (diff < 60) return Math.floor(diff) + 's atrás';
  if (diff < 3600) return Math.floor(diff/60) + 'min atrás';
  if (diff < 86400) return Math.floor(diff/3600) + 'h atrás';
  return Math.floor(diff/86400) + 'd atrás';
}

function fmtUsd(n) {
  if (n === undefined || n === null || isNaN(n)) return '—';
  return '$' + Number(n).toLocaleString('pt-BR', {maximumFractionDigits: 2});
}

// Mostra preço (¢, estilo probabilidade) e o equivalente em odd decimal (1/preço)
function fmtOddBoth(price) {
  const p = Number(price);
  if (!p || isNaN(p) || p <= 0) return '—';
  const cents = (p * 100).toFixed(1) + '¢';
  const decimal = (1 / p).toFixed(2) + 'x';
  return `${decimal} · ${cents}`;
}

function displayName(w) {
  return (w.nickname && w.nickname.trim()) ? w.nickname.trim() : shortAddr(w.address);
}

function renderChips() {
  const el = document.getElementById('wallet-chips');
  el.innerHTML = wallets.map(w => `
    <div class="chip">
      <span class="dot" style="background:${w.color}"></span>
      <span class="chip-name">${displayName(w)}</span>
      <span class="chip-addr">${shortAddr(w.address)}</span>
      <button title="Renomear" onclick="renameWallet('${w.address}')">✎</button>
      <button title="Remover" onclick="removeWallet('${w.address}')">✕</button>
    </div>
  `).join('');
}

function renameWallet(address) {
  const w = wallets.find(x => x.address === address);
  if (!w) return;
  const val = prompt('Apelido para ' + shortAddr(address) + ':', w.nickname || '');
  if (val === null) return;
  w.nickname = val.trim();
  saveWallets();
  renderChips();
  renderFeed();
}

function removeWallet(address) {
  wallets = wallets.filter(w => w.address !== address);
  delete activityCache[address];
  saveWallets();
  renderChips();
  renderFeed();
  toggleEmptyState();
}

function toggleEmptyState() {
  document.getElementById('empty-placeholder').style.display = wallets.length === 0 ? 'block' : 'none';
  document.getElementById('feed').style.display = wallets.length === 0 ? 'none' : 'block';
}

function addWallet() {
  const nickInput = document.getElementById('nick-input');
  const addrInput = document.getElementById('addr-input');
  let addr = addrInput.value.trim().toLowerCase();
  const nick = nickInput.value.trim();

  if (!addr) return;
  if (!/^0x[a-fA-F0-9]{40}$/.test(addr)) {
    alert('Isso não parece um endereço de carteira válido. Deve começar com 0x e ter 42 caracteres no total.');
    return;
  }
  if (wallets.some(w => w.address === addr)) {
    alert('Essa carteira já está na sua lista.');
    return;
  }
  wallets.push({ address: addr, nickname: nick, color: COLORS[wallets.length % COLORS.length] });
  saveWallets();
  nickInput.value = '';
  addrInput.value = '';
  renderChips();
  toggleEmptyState();
  fetchActivity(addr);
}

async function fetchActivity(address) {
  try {
    const res = await fetch(`${API}?user=${address}&limit=25`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    activityCache[address] = Array.isArray(data) ? data : [];

    // Se algum item trouxer nome/pseudônimo e o usuário ainda não deu apelido, sugere preencher
    const w = wallets.find(x => x.address === address);
    if (w && !w._suggestedName) {
      const withProfile = activityCache[address].find(d => d.name || d.pseudonym);
      if (withProfile) w._suggestedName = withProfile.name || withProfile.pseudonym;
    }
  } catch (err) {
    activityCache[address] = activityCache[address] || [];
    activityCache[address]._error = err.message;
  }
  renderFeed();
}

function fetchAll() {
  wallets.forEach(w => fetchActivity(w.address));
}

function renderFeed() {
  const feedEl = document.getElementById('feed');
  const countEl = document.getElementById('feed-count');

  if (wallets.length === 0) { feedEl.innerHTML = ''; countEl.textContent = ''; return; }

  let merged = [];
  let anyLoaded = false;
  let anyError = null;

  wallets.forEach(w => {
    const items = activityCache[w.address];
    if (items === undefined) return;
    anyLoaded = true;
    if (items._error) anyError = items._error;
    items.forEach(item => merged.push({ item, wallet: w }));
  });

  if (!anyLoaded) {
    feedEl.innerHTML = '<div class="loading"><span class="spinner"></span>Carregando histórico…</div>';
    countEl.textContent = '';
    return;
  }

  merged.sort((a, b) => b.item.timestamp - a.item.timestamp);
  merged = merged.slice(0, 150);

  if (merged.length === 0) {
    feedEl.innerHTML = anyError
      ? `<div class="error">Não foi possível carregar (${anyError}). Verifique os endereços.</div>`
      : '<div class="empty">Nenhuma atividade encontrada ainda para as carteiras acompanhadas.</div>';
    countEl.textContent = '';
    return;
  }

  countEl.textContent = merged.length + ' eventos';

  feedEl.innerHTML = merged.map(({ item, wallet }) => {
    const side = (item.side || '').toUpperCase();
    const sideClass = side === 'BUY' ? 'buy' : side === 'SELL' ? 'sell' : 'other';
    const sideLabel = side === 'BUY' ? 'COMPRA' : side === 'SELL' ? 'VENDA' : (item.type || '—');
    const outcomeClass = /yes/i.test(item.outcome || '') ? 'outcome-yes' : /no/i.test(item.outcome || '') ? 'outcome-no' : '';
    const amount = item.usdcSize !== undefined ? item.usdcSize : item.size;

    return `
      <div class="row">
        <div class="row-bar" style="background:${wallet.color}"></div>
        <div class="side-tag ${sideClass}">${sideLabel}</div>
        <div class="row-mid">
          <div class="row-who"><span class="dot" style="background:${wallet.color}"></span><span class="row-who-name">${displayName(wallet)}</span></div>
          <div class="row-title">${item.title || 'Mercado sem título'}</div>
          <div class="row-sub"><span class="${outcomeClass}">${item.outcome || ''}</span> · ${timeAgo(item.timestamp)}</div>
        </div>
        <div class="row-num">
          <div class="row-amt">${fmtUsd(amount)}</div>
          <div class="row-odd">${fmtOddBoth(item.price)}</div>
        </div>
      </div>
    `;
  }).join('');
}

document.getElementById('add-btn').addEventListener('click', addWallet);
document.getElementById('addr-input').addEventListener('keydown', e => { if (e.key === 'Enter') addWallet(); });
document.getElementById('nick-input').addEventListener('keydown', e => { if (e.key === 'Enter') addWallet(); });

function tickClock() {
  const el = document.getElementById('clock');
  if (el) el.textContent = new Date().toLocaleTimeString('pt-BR');
}
setInterval(tickClock, 1000);
tickClock();

loadWallets();
renderChips();
toggleEmptyState();
fetchAll();
setInterval(fetchAll, POLL_MS);
</script>
</body>
</html>
